<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Journal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Navigation -->
    <nav class="nav">
      <button class="nav-btn active" data-view="today">Today</button>
      <button class="nav-btn" data-view="weekly">Weekly</button>
    </nav>

    <!-- Today View -->
    <div id="today-view" class="view active">
      <div class="header">
        <h1 id="current-date"></h1>
        <button id="summarize-btn" class="btn-secondary">Summarize Day</button>
      </div>

      <!-- Daily Summary (if exists) -->
      <div id="summary-section" class="summary-section hidden">
        <h3>Daily Summary</h3>
        <textarea id="summary-text" placeholder="Write your daily summary..."></textarea>
        <button id="save-summary-btn" class="btn-primary">Save Summary</button>
      </div>

      <!-- Add Entry Form -->
      <div class="add-entry">
        <h3>Add Learning Entry</h3>
        
        <!-- Entry Type Selector -->
        <div class="entry-type-selector">
          <label for="entry-type">Entry Type:</label>
          <select id="entry-type" required>
            <option value="">Select type *</option>
            <option value="DSA">🧠 DSA Problem</option>
            <option value="SQL">🗄️ SQL / DB / Query</option>
            <option value="TECH">⚙️ Tech Concept</option>
          </select>
        </div>

        <!-- DSA Form -->
        <form id="dsa-form" class="entry-form hidden">
          <input type="text" id="dsa-title" placeholder="Problem Title *" required>
          <input type="url" id="dsa-url" placeholder="Problem URL (optional)">
          
          <div class="form-row">
            <select id="dsa-platform" required>
              <option value="">Select Platform *</option>
              <option value="LeetCode">LeetCode</option>
              <option value="GFG">GeeksforGeeks</option>
              <option value="Codeforces">Codeforces</option>
              <option value="HackerRank">HackerRank</option>
              <option value="Other">Other</option>
            </select>
            
            <select id="dsa-topic" required>
              <option value="">Select Topic *</option>
              <option value="Array">Array</option>
              <option value="String">String</option>
              <option value="Linked List">Linked List</option>
              <option value="Stack">Stack</option>
              <option value="Queue">Queue</option>
              <option value="Tree">Tree</option>
              <option value="Graph">Graph</option>
              <option value="DP">Dynamic Programming</option>
              <option value="Greedy">Greedy</option>
              <option value="Backtracking">Backtracking</option>
              <option value="Math">Math</option>
              <option value="Binary Search">Binary Search</option>
              <option value="Sorting">Sorting</option>
              <option value="Recursion">Recursion</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-row">
            <select id="dsa-difficulty">
              <option value="">Difficulty (optional)</option>
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
            
            <input type="number" id="dsa-time" placeholder="Time (mins)" min="1">
          </div>

          <textarea id="dsa-notes" placeholder="Approach, mistakes, insights..." rows="4"></textarea>
          
          <button type="submit" class="btn-primary">Add Entry</button>
        </form>

        <!-- SQL Form -->
        <form id="sql-form" class="entry-form hidden">
          <input type="text" id="sql-title" placeholder="Topic Title (e.g., GROUP BY vs HAVING) *" required>
          
          <textarea id="sql-query" placeholder="SQL Query or Example..." rows="4"></textarea>
          
          <textarea id="sql-notes" placeholder="Explanation / Notes..." rows="3"></textarea>
          
          <textarea id="sql-mistake" placeholder="Mistake / Gotcha (optional)..." rows="2"></textarea>
          
          <button type="submit" class="btn-primary">Add Entry</button>
        </form>

        <!-- Tech Form -->
        <form id="tech-form" class="entry-form hidden">
          <input type="text" id="tech-title" placeholder="Concept Title (e.g., Database Indexing) *" required>
          
          <textarea id="tech-description" placeholder="Description / What I learned..." rows="4" required></textarea>
          
          <textarea id="tech-why" placeholder="Why it matters..." rows="2"></textarea>
          
          <textarea id="tech-stuck" placeholder="Where I got stuck (optional)..." rows="2"></textarea>
          
          <button type="submit" class="btn-primary">Add Entry</button>
        </form>
      </div>

      <!-- Entries List -->
      <div id="entries-list" class="entries-list">
        <h3>Learning Entries Today (<span id="today-count">0</span>)</h3>
        <div id="entries-container"></div>
      </div>
    </div>

    <!-- Weekly View -->
    <div id="weekly-view" class="view">
      <div class="header">
        <h1>Weekly Overview</h1>
      </div>
      
      <div id="weekly-stats" class="weekly-stats"></div>
      <div id="weekly-days" class="weekly-days"></div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="summary.js"></script>
  <script src="popup.js"></script>
</body>
</html>
